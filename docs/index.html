<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>gamedev-hub</title>
<style>
  :root {
    --bg: #f6f7f9; --card: #ffffff; --text: #1b1f24; --muted: #6a737d; --line: #e1e4e8;
    --empty: #e6e8eb; --accent: #1b1f24;
    color-scheme: light dark;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #0d1117; --card: #161b22; --text: #e6edf3; --muted: #8b949e; --line: #30363d; --empty: #21262d; --accent: #e6edf3; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.45 -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }
  a { color: inherit; }
  .wrap { max-width: 1100px; margin: 0 auto; padding: 24px 16px 48px; }
  header { display: flex; flex-wrap: wrap; align-items: baseline; gap: 8px 16px; margin-bottom: 20px; }
  header h1 { margin: 0; font-size: 22px; }
  header .sub { color: var(--muted); }
  .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 10px; margin-bottom: 20px; }
  .stat { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; }
  .stat b { display: block; font-size: 22px; font-weight: 600; }
  .stat span { color: var(--muted); font-size: 12px; }
  .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 14px; margin-bottom: 28px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 16px; border-top: 4px solid var(--c); }
  .card h2 { margin: 0 0 2px; font-size: 17px; display: flex; align-items: center; gap: 8px; }
  .card h2 a { text-decoration: none; }
  .badge { font-size: 11px; font-weight: 500; padding: 2px 8px; border-radius: 999px; background: var(--c); color: #fff; }
  .tag { color: var(--muted); margin: 0 0 10px; }
  .row { display: flex; justify-content: space-between; gap: 8px; font-size: 13px; padding: 3px 0; }
  .row span:first-child { color: var(--muted); }
  .bar { height: 8px; background: var(--empty); border-radius: 4px; overflow: hidden; margin: 8px 0 4px; }
  .bar i { display: block; height: 100%; background: var(--c); }
  .ms { margin: 8px 0 0; padding: 0; list-style: none; font-size: 12px; }
  .ms li { display: grid; grid-template-columns: 1fr 70px 44px; gap: 8px; align-items: center; padding: 2px 0; color: var(--muted); }
  .ms li .bar { margin: 0; height: 5px; }
  .ms li.closed { opacity: .55; }
  .next { margin-top: 10px; font-size: 13px; padding: 8px 10px; background: var(--bg); border-radius: 8px; }
  .msg { font-size: 12px; color: var(--muted); margin-top: 4px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  section h3 { font-size: 15px; margin: 0 0 10px; display: flex; flex-wrap: wrap; align-items: center; gap: 8px 14px; }
  .years { display: inline-flex; gap: 4px; }
  .years button, .legend button { background: var(--card); border: 1px solid var(--line); color: var(--text); border-radius: 6px; padding: 3px 9px; font: inherit; font-size: 12px; cursor: pointer; }
  .years button.on { background: var(--accent); color: var(--bg); border-color: var(--accent); }
  .legend { display: flex; flex-wrap: wrap; gap: 6px; margin-left: auto; }
  .legend button { display: inline-flex; align-items: center; gap: 6px; }
  .legend button i { width: 10px; height: 10px; border-radius: 2px; background: var(--c); display: inline-block; }
  .legend button.off { opacity: .4; }
  .calwrap { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 14px; overflow-x: auto; }
  .cal { display: grid; grid-template-columns: 28px repeat(53, 13px); grid-auto-rows: 13px; gap: 3px; width: max-content; }
  .cal .m { grid-row: 1; font-size: 10px; color: var(--muted); line-height: 13px; }
  .cal .wd { font-size: 10px; color: var(--muted); line-height: 13px; }
  .cal .d { border-radius: 2px; background: var(--empty); }
  .cal .d.future { background: transparent; }
  .cal .d.has { cursor: pointer; }
  .tip { position: fixed; pointer-events: none; background: var(--text); color: var(--bg); font-size: 12px; padding: 6px 9px; border-radius: 6px; white-space: nowrap; display: none; z-index: 9; }
  .summary { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 10px; margin-top: 14px; }
  .summary div { font-size: 12px; color: var(--muted); }
  .summary b { color: var(--text); font-weight: 600; }
  footer { margin-top: 28px; color: var(--muted); font-size: 12px; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>gamedev-hub</h1>
    <span class="sub" id="gen"></span>
    <a class="sub" href="https://github.com/artemiiShabanov/gamedev-hub" style="margin-left:auto">репозиторий →</a>
  </header>
  <div class="stats" id="stats"></div>
  <div class="cards" id="cards"></div>
  <section>
    <h3>Активность <span class="years" id="years"></span> <span class="legend" id="legend"></span></h3>
    <div class="calwrap"><div class="cal" id="cal"></div><div class="summary" id="summary"></div></div>
  </section>
  <footer>Данные собираются GitHub Actions раз в сутки из коммитов и issues всех репозиториев в <code>projects.yaml</code>.</footer>
</div>
<div class="tip" id="tip"></div>
<script>
const PHASE = {idea:"идея", prototype:"прототип", "vertical-slice":"вертикальный срез", content:"контент",
  polish:"полировка", released:"выпущена", paused:"на паузе", archived:"в архиве"};
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const fmt = d => d ? new Date(d + "T00:00:00").toLocaleDateString("ru-RU", {day:"numeric", month:"short", year:"numeric"}) : "—";
const plural = (n, a, b, c) => { const m = n % 100, k = n % 10; return n + " " + (m > 10 && m < 20 ? c : k === 1 ? a : k > 1 && k < 5 ? b : c); };

let DATA, year, hidden = new Set();

async function main() {
  DATA = await (await fetch("data.json", {cache: "no-store"})).json();
  const today = new Date(); today.setHours(0,0,0,0);
  year = today.getFullYear();
  document.getElementById("gen").textContent = "обновлено " + DATA.generated_at.replace("T", " ").slice(0, 16);
  renderStats(today); renderCards(); renderYears(today); renderLegend(); renderCal(today);
}

function renderStats(today) {
  const act = DATA.activity, ymd = d => d.toISOString().slice(0,10);
  const inDays = n => Object.keys(act).filter(d => (today - new Date(d + "T00:00:00")) / 864e5 < n);
  const commits = ds => ds.reduce((s, d) => s + Object.values(act[d]).reduce((a, b) => a + b, 0), 0);
  let streak = 0; for (let d = new Date(today); act[ymd(d)]; d.setDate(d.getDate() - 1)) streak++;
  const d30 = inDays(30), d365 = inDays(365);
  const html = [
    [DATA.projects.filter(p => !["paused","archived","released"].includes(p.phase)).length, "активных проектов"],
    [d30.length, "рабочих дней за 30 дн."],
    [commits(d30), "коммитов за 30 дн."],
    [d365.length, "рабочих дней за год"],
    [commits(d365), "коммитов за год"],
    [streak, "дней подряд"],
  ].map(([v, l]) => `<div class="stat"><b>${v}</b><span>${l}</span></div>`).join("");
  document.getElementById("stats").innerHTML = html;
}

function renderCards() {
  const el = document.getElementById("cards");
  const ps = [...DATA.projects].sort((a, b) => (b.last_commit || "").localeCompare(a.last_commit || ""));
  el.innerHTML = ps.map(p => {
    const pr = p.progress, pct = pr.total ? Math.round(100 * pr.done / pr.total) : 0;
    const ms = pr.milestones.filter(m => m.open + m.closed).map(m => {
      const t = m.open + m.closed, q = Math.round(100 * m.closed / t);
      return `<li class="${m.state}"><span>${esc(m.title)}</span><span class="bar"><i style="width:${q}%"></i></span><span>${m.closed}/${t}</span></li>`;
    }).join("");
    return `<article class="card" style="--c:${p.color}">
      <h2><a href="${p.url}" target="_blank" rel="noopener">${esc(p.name)}</a><span class="badge">${PHASE[p.phase] || esc(p.phase)}</span></h2>
      <p class="tag">${esc(p.tagline)}</p>
      <div class="row"><span>Движок</span><span>${esc(p.engine)}</span></div>
      <div class="row"><span>Последний коммит</span><span>${fmt(p.last_commit)}</span></div>
      <div class="msg" title="${esc(p.last_message)}">${esc(p.last_message)}</div>
      <div class="row"><span>Коммитов</span><span>${p.commits_30d} за 30 дн. · ${p.commits_total} всего · ${plural(p.active_days, "день", "дня", "дней")}</span></div>
      ${pr.total ? `<div class="bar"><i style="width:${pct}%"></i></div>
      <div class="row"><span>${p.tracker === "github-issues" ? "Issues" : "Задачи"}</span><span>${pr.done}/${pr.total} · ${pct}% · открыто ${pr.open}</span></div>` : ""}
      ${ms ? `<ul class="ms">${ms}</ul>` : ""}
      ${p.next ? `<div class="next">Дальше: ${esc(p.next)}</div>` : ""}
    </article>`;
  }).join("");
}

function renderYears(today) {
  const y0 = +DATA.since.slice(0,4), ys = [];
  for (let y = today.getFullYear(); y >= y0; y--) ys.push(y);
  const el = document.getElementById("years");
  el.innerHTML = ys.map(y => `<button data-y="${y}" class="${y === year ? "on" : ""}">${y}</button>`).join("");
  el.onclick = e => { const b = e.target.closest("button"); if (!b) return; year = +b.dataset.y; renderYears(today); renderCal(today); };
}

function renderLegend() {
  const el = document.getElementById("legend");
  el.innerHTML = DATA.projects.map(p => `<button data-id="${p.id}" style="--c:${p.color}" class="${hidden.has(p.id) ? "off" : ""}"><i></i>${esc(p.name)}</button>`).join("");
  el.onclick = e => { const b = e.target.closest("button"); if (!b) return; const id = b.dataset.id;
    hidden.has(id) ? hidden.delete(id) : hidden.add(id); renderLegend(); renderCal(); };
}

function renderCal(today) {
  today = today || (() => { const t = new Date(); t.setHours(0,0,0,0); return t; })();
  const colors = Object.fromEntries(DATA.projects.map(p => [p.id, p.color]));
  const names = Object.fromEntries(DATA.projects.map(p => [p.id, p.name]));
  const act = DATA.activity;
  const start = new Date(year, 0, 1); start.setDate(start.getDate() - ((start.getDay() + 6) % 7)); // Monday on/before Jan 1
  const end = new Date(year, 11, 31);
  const cal = document.getElementById("cal");
  const cells = [];
  ["Пн","","Ср","","Пт","",""].forEach((l, i) => cells.push(`<div class="wd" style="grid-row:${i + 2}">${l}</div>`));
  let maxc = 1; for (const d in act) { const y = +d.slice(0,4); if (y === year) maxc = Math.max(maxc, Object.values(act[d]).reduce((a, b) => a + b, 0)); }
  const perProject = {}, perMonth = Array(12).fill(0); let days = 0, commits = 0, lastMonth = -1;
  for (let col = 2, d = new Date(start); d <= end; col++) {
    for (let r = 0; r < 7; r++, d.setDate(d.getDate() + 1)) {
      if (d.getFullYear() !== year) { if (d < start || d.getFullYear() < year) { cells.push(`<div class="d future" style="grid-column:${col};grid-row:${r + 2}"></div>`); } continue; }
      if (d.getDate() <= 7 && d.getMonth() !== lastMonth) { lastMonth = d.getMonth(); cells.push(`<div class="m" style="grid-column:${col}">${d.toLocaleDateString("ru-RU", {month:"short"}).replace(".", "")}</div>`); }
      const key = d.toISOString().slice(0,10);
      if (d > today) { cells.push(`<div class="d future" style="grid-column:${col};grid-row:${r + 2}"></div>`); continue; }
      const v = act[key]; let items = v ? Object.entries(v).filter(([k]) => !hidden.has(k)).sort((a, b) => b[1] - a[1]) : [];
      if (!items.length) { cells.push(`<div class="d" style="grid-column:${col};grid-row:${r + 2}"></div>`); continue; }
      const total = items.reduce((s, [, n]) => s + n, 0); days++; commits += total; perMonth[d.getMonth()]++;
      items.forEach(([k, n]) => { perProject[k] = perProject[k] || {days:0, commits:0}; perProject[k].days++; perProject[k].commits += n; });
      const op = 0.45 + 0.55 * Math.min(1, total / Math.max(1, maxc * 0.6));
      let bg;
      if (items.length === 1) bg = colors[items[0][0]];
      else { let acc = 0; bg = "linear-gradient(to bottom," + items.map(([k, n]) => { const a = acc; acc += 100 * n / total; return `${colors[k]} ${a}% ${acc}%`; }).join(",") + ")"; }
      const tip = fmt(key) + " · " + items.map(([k, n]) => `${names[k]} ${n}`).join(", ");
      cells.push(`<div class="d has" style="grid-column:${col};grid-row:${r + 2};background:${bg};opacity:${op.toFixed(2)}" data-tip="${esc(tip)}"></div>`);
    }
  }
  cal.innerHTML = cells.join("");
  const best = perMonth.indexOf(Math.max(...perMonth));
  const sum = document.getElementById("summary");
  sum.innerHTML = [
    `<div><b>${plural(days, "рабочий день", "рабочих дня", "рабочих дней")}</b> в ${year}, ${plural(commits, "коммит", "коммита", "коммитов")}</div>`,
    days ? `<div>самый активный месяц: <b>${new Date(year, best, 1).toLocaleDateString("ru-RU", {month:"long"})}</b> (${plural(perMonth[best], "день", "дня", "дней")})</div>` : "",
    ...DATA.projects.filter(p => perProject[p.id]).map(p => `<div><i style="display:inline-block;width:9px;height:9px;border-radius:2px;background:${p.color};margin-right:6px"></i><b>${esc(p.name)}</b>: ${plural(perProject[p.id].days, "день", "дня", "дней")}, ${perProject[p.id].commits} коммитов</div>`),
  ].join("");
}

const tip = document.getElementById("tip");
document.addEventListener("mousemove", e => {
  const t = e.target.closest(".d.has");
  if (!t) { tip.style.display = "none"; return; }
  tip.textContent = t.dataset.tip; tip.style.display = "block";
  tip.style.left = Math.min(e.clientX + 12, innerWidth - tip.offsetWidth - 8) + "px"; tip.style.top = (e.clientY + 14) + "px";
});
main().catch(e => { document.getElementById("cards").textContent = "Не удалось загрузить data.json: " + e; });
</script>
</body>
</html>
