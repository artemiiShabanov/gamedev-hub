# gamedev-hub: реестр проектов. Единственный файл, который правится руками.
# Всё остальное (README.md, docs/, data/) генерирует `python3 tools/build_dashboard.py`.
#
# phase:  idea | prototype | vertical-slice | content | polish | released | paused | archived
# color:  цвет проекта в календаре активности (hex)
# tracker: github-issues | tasks-yaml | none  (как считать прогресс)
# store:  ссылка на App Store / itch и т.п. для выпущенных игр

owner: artemiiShabanov
